<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대학생 과제 기한 준수 여부 예측 모델 (총 200명 데이터 기반)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; padding: 30px 15px; }
    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 26px; color: #0f172a; margin-bottom: 8px; font-weight: 700; }
    header p { color: var(--text-sub); font-size: 15px; }

    .card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 25px; }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; color: #1e293b; }

    /* 통계 대시보드 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-box { background: #f1f5f9; padding: 15px; border-radius: 12px; text-align: center; }
    .stat-box .val { font-size: 22px; font-weight: 700; color: var(--primary); }
    .stat-box .lbl { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

    /* 입력 폼 */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #334155; }
    select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background-color: #fff; color: var(--text-main); outline: none; transition: border-color 0.2s; }
    select:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); }

    /* 결과 영역 */
    .result-container { display: none; margin-top: 25px; padding: 20px; border-radius: 12px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .result-pass { background-color: #ecfdf5; border: 1px solid #a7f3d0; }
    .result-fail { background-color: #fef2f2; border: 1px solid #fecaca; }

    .result-header { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .result-pass .result-header { color: var(--success); }
    .result-fail .result-header { color: var(--danger); }

    .result-desc { font-size: 14px; color: #334155; margin-bottom: 15px; }
    .prob-bar-container { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 6px; }
    .prob-bar { height: 100%; transition: width 0.5s ease-in-out; }
    .pass-bar { background-color: var(--success); }
    .fail-bar { background-color: var(--danger); }

    /* 결정 트리 규칙 뷰 */
    .tree-box { background: #0f172a; color: #e2e8f0; padding: 18px; border-radius: 10px; font-family: monospace; font-size: 12px; max-height: 280px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    .rule-path { font-size: 13px; background: rgba(0,0,0,0.04); padding: 12px; border-radius: 6px; margin-top: 15px; font-family: monospace; border-left: 4px solid var(--primary); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎓 대학생 과제 기한 준수 여부 예측기</h1>
    <p>총 200건의 설문 데이터로 고도화된 의사결정 트리(Decision Tree) 모델</p>
  </header>

  <!-- 데이터 현황 대시보드 -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="val" id="stat-total">200명</div>
      <div class="lbl">총 학습 데이터셋</div>
    </div>
    <div class="stat-box">
      <div class="val" id="stat-pass">-</div>
      <div class="lbl">기한 준수율 (전체)</div>
    </div>
    <div class="stat-box">
      <div class="val" id="stat-fail">-</div>
      <div class="lbl">기한 미준수/지각율</div>
    </div>
    <div class="stat-box">
      <div class="val">5개</div>
      <div class="lbl">입력 변수(Feature)</div>
    </div>
  </div>

  <!-- 입력 폼 카드 -->
  <div class="card">
    <div class="card-title">📝 학습 습관 입력하기</div>
    <form id="predict-form">
      <div class="form-group">
        <label for="q1">1. 평소 과제를 언제 시작하나요?</label>
        <select id="q1" required>
          <option value="과제를 안내받은 당일">과제를 안내받은 당일</option>
          <option value="제출 기한 3일 이상 전">제출 기한 3일 이상 전</option>
          <option value="제출 기한 1~2일 전" selected>제출 기한 1~2일 전</option>
          <option value="제출 당일">제출 당일</option>
        </select>
      </div>

      <div class="form-group">
        <label for="q2">2. 과제를 시작하기 전에 계획을 세우나요?</label>
        <select id="q2" required>
          <option value="항상 그렇다">항상 그렇다</option>
          <option value="자주 그렇다" selected>자주 그렇다</option>
          <option value="가끔 그렇다">가끔 그렇다</option>
          <option value="거의 그렇지 않다">거의 그렇지 않다</option>
          <option value="전혀 그렇지 않다">전혀 그렇지 않다</option>
        </select>
      </div>

      <div class="form-group">
        <label for="q3">3. 과제 제출 기한을 기억하기 위해 어떤 방법을 사용하나요?</label>
        <select id="q3" required>
          <option value="달력·일정 관리 앱" selected>달력·일정 관리 앱</option>
          <option value="메모장·플래너">메모장·플래너</option>
          <option value="휴대전화 알림·알람">휴대전화 알림·알람</option>
          <option value="별도로 기록하지 않음">별도로 기록하지 않음</option>
        </select>
      </div>

      <div class="form-group">
        <label for="q4">4. 과제를 할 때 스마트폰이나 SNS 때문에 집중이 끊기는 빈도는?</label>
        <select id="q4" required>
          <option value="거의 없다">거의 없다</option>
          <option value="드물다">드물다</option>
          <option value="가끔 있다" selected>가끔 있다</option>
          <option value="자주 있다">자주 있다</option>
          <option value="매우 자주 있다">매우 자주 있다</option>
        </select>
      </div>

      <div class="form-group">
        <label for="q5">5. 과제를 수행할 때 하루 평균 어느 정도 시간을 투자하나요?</label>
        <select id="q5" required>
          <option value="30분 미만">30분 미만</option>
          <option value="30분 이상~1시간 미만">30분 이상~1시간 미만</option>
          <option value="1시간 이상~2시간 미만" selected>1시간 이상~2시간 미만</option>
          <option value="2시간 이상">2시간 이상</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">과제 기한 준수 여부 예측하기</button>
    </form>

    <!-- 결과 영역 -->
    <div id="result-container" class="result-container">
      <div id="result-header" class="result-header"></div>
      <div id="result-desc" class="result-desc"></div>
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600;">
          <span id="prob-label">예측 신뢰 확률</span>
          <span id="prob-text">0%</span>
        </div>
        <div class="prob-bar-container">
          <div id="prob-bar" class="prob-bar"></div>
        </div>
      </div>
      <div class="rule-path" id="rule-path"></div>
    </div>
  </div>

  <!-- 학습된 의사결정 트리 구조 보기 -->
  <div class="card">
    <div class="card-title">🌲 200개 데이터로 업데이트된 분기 규칙 (Decision Tree)</div>
    <div class="tree-box" id="tree-display">트리를 생성하는 중...</div>
  </div>
</div>

// 2. 데이터 전처리 및 파싱 (앞뒤 탭 및 공백 자동 정제)
const lines = rawData.trim().split("\n");
const headers = lines[0].split("\t").map(h => h.trim());
const featureNames = headers.slice(0, 5);

const dataset = [];
for (let i = 1; i < lines.length; i++) {
  const line = lines[i].trim();
  if (!line) continue;
  const parts = line.split("\t").map(p => p.trim());
  if (parts.length === 6) {
    const row = {};
    for (let j = 0; j < 5; j++) {
      row[featureNames[j]] = parts[j];
    }
    row._label = parts[5].includes("모든 과제를 기한 내에 제출했다") ? "준수" : "미준수";
    dataset.push(row);
  }
}

// 총계 및 준수/미준수 비율 대시보드 갱신
const totalCount = dataset.length;
const passCount = dataset.filter(d => d._label === "준수").length;
const failCount = totalCount - passCount;

document.getElementById("stat-total").innerText = `${totalCount}명`;
document.getElementById("stat-pass").innerText = `${((passCount / totalCount) * 100).toFixed(1)}% (${passCount}명)`;
document.getElementById("stat-fail").innerText = `${((failCount / totalCount) * 100).toFixed(1)}% (${failCount}명)`;

// 3. 의사결정 트리 (ID3 엔트로피 / Information Gain 기반) 구현
function entropy(rows) {
  if (rows.length === 0) return 0;
  const pPass = rows.filter(r => r._label === "준수").length / rows.length;
  const pFail = 1 - pPass;
  let ent = 0;
  if (pPass > 0) ent -= pPass * Math.log2(pPass);
  if (pFail > 0) ent -= pFail * Math.log2(pFail);
  return ent;
}

function getMajority(rows) {
  const pass = rows.filter(r => r._label === "준수").length;
  const fail = rows.length - pass;
  return {
    label: pass >= fail ? "준수" : "미준수",
    prob: Math.max(pass, fail) / rows.length,
    passCount: pass,
    failCount: fail,
    total: rows.length
  };
}

function buildTree(rows, availableFeatures, depth = 0, maxDepth = 4) {
  const majority = getMajority(rows);

  // 분할 중단 기준: 순수 노드 도달, 특성 소진, 샘플 수 4개 이하, 최대 깊이 도달
  if (rows.length <= 4 || majority.passCount === rows.length || majority.failCount === rows.length || availableFeatures.length === 0 || depth >= maxDepth) {
    return {
      type: 'leaf',
      prediction: majority.label,
      confidence: majority.prob,
      passRate: (majority.passCount / majority.total),
      stats: majority
    };
  }

  const baseEntropy = entropy(rows);
  let bestGain = -1;
  let bestFeature = null;

  for (const feat of availableFeatures) {
    const groups = {};
    for (const r of rows) {
      const val = r[feat];
      if (!groups[val]) groups[val] = [];
      groups[val].push(r);
    }

    let subsetEntropy = 0;
    for (const val in groups) {
      subsetEntropy += (groups[val].length / rows.length) * entropy(groups[val]);
    }

    const gain = baseEntropy - subsetEntropy;
    if (gain > bestGain) {
      bestGain = gain;
      bestFeature = feat;
    }
  }

  // 정보 이득이 너무 적으면 잎 노드로 종료
  if (bestGain <= 0.015) {
    return {
      type: 'leaf',
      prediction: majority.label,
      confidence: majority.prob,
      passRate: (majority.passCount / majority.total),
      stats: majority
    };
  }

  const node = {
    type: 'node',
    feature: bestFeature,
    children: {},
    defaultPrediction: majority
  };

  const remainingFeatures = availableFeatures.filter(f => f !== bestFeature);
  const groups = {};
  for (const r of rows) {
    const val = r[bestFeature];
    if (!groups[val]) groups[val] = [];
    groups[val].push(r);
  }

  for (const val in groups) {
    node.children[val] = buildTree(groups[val], remainingFeatures, depth + 1, maxDepth);
  }

  return node;
}

// 200건의 데이터로 모델 트리 학습
const decisionTree = buildTree(dataset, [...featureNames], 0, 4);

// 학습된 트리 구조 텍스트 출력 함수
function printTree(node, indent = "") {
  if (node.type === "leaf") {
    const p = (node.passRate * 100).toFixed(0);
    return `👉 [${node.prediction}] (준수율: ${p}%, 표본: ${node.stats.total}명)\n`;
  }
  let str = "";
  for (const val in node.children) {
    str += `${indent}IF [${node.feature.substring(3)}] == "${val}" THEN `;
    str += printTree(node.children[val], indent + "  ");
  }
  return str;
}
document.getElementById("tree-display").textContent = printTree(decisionTree);

// 4. 추론(Inference) 함수
function predictWithTree(tree, sample, path = []) {
  if (tree.type === "leaf") {
    return { result: tree, path: path };
  }

  const feat = tree.feature;
  const val = sample[feat];
  path.push(`${feat.substring(3)}: "${val}"`);

  if (tree.children && tree.children[val]) {
    return predictWithTree(tree.children[val], sample, path);
  } else {
    // 훈련 중 나타나지 않은 조합은 현재 부모 노드의 다수결로 대체
    return {
      result: {
        prediction: tree.defaultPrediction.label,
        confidence: tree.defaultPrediction.prob,
        passRate: tree.defaultPrediction.passCount / tree.defaultPrediction.total,
        stats: tree.defaultPrediction
      },
      path: path
    };
  }
}

// 5. 폼 제출 및 예측 처리
document.getElementById("predict-form").addEventListener("submit", function(e) {
  e.preventDefault();

  const userInputs = {
    [featureNames[0]]: document.getElementById("q1").value,
    [featureNames[1]]: document.getElementById("q2").value,
    [featureNames[2]]: document.getElementById("q3").value,
    [featureNames[3]]: document.getElementById("q4").value,
    [featureNames[4]]: document.getElementById("q5").value
  };

  const { result, path } = predictWithTree(decisionTree, userInputs, []);

  const resContainer = document.getElementById("result-container");
  const resHeader = document.getElementById("result-header");
  const resDesc = document.getElementById("result-desc");
  const probBar = document.getElementById("prob-bar");
  const probText = document.getElementById("prob-text");
  const probLabel = document.getElementById("prob-label");
  const rulePath = document.getElementById("rule-path");

  resContainer.style.display = "block";
  resContainer.className = "result-container " + (result.prediction === "준수" ? "result-pass" : "result-fail");

  const passPercent = (result.passRate * 100).toFixed(1);
  const confPercent = (result.confidence * 100).toFixed(0);

  if (result.prediction === "준수") {
    resHeader.innerHTML = "✅ 과제 기한 내 제출 가능성이 매우 높습니다!";
    resDesc.innerHTML = `200명의 학습 데이터 분석 결과, 입력하신 학습 습관은 과제를 성실하게 완수하는 그룹에 속합니다.<br>
      해당 조건 하에서의 <strong>기한 준수 확률은 ${passPercent}%</strong> (표본: ${result.stats.total}명) 입니다.`;
    probBar.className = "prob-bar pass-bar";
    probBar.style.width = `${passPercent}%`;
    probLabel.innerText = "예측 준수 확률";
    probText.innerText = `${passPercent}% (신뢰도: ${confPercent}%)`;
  } else {
    resHeader.innerHTML = "⚠️ 과제 기한 초과(지각/미제출) 위험이 감지되었습니다!";
    resDesc.innerHTML = `200명의 학습 데이터 분석 결과, 시작 시점, 마감 기록 방식 및 집중 방해 요인 등으로 인해 기한을 넘길 위험이 높습니다.<br>
      해당 조건 하에서의 <strong>기한 준수율은 ${passPercent}%</strong>에 불과합니다.`;
    probBar.className = "prob-bar fail-bar";
    probBar.style.width = `${100 - passPercent}%`;
    probLabel.innerText = "미준수/지각 위험도";
    probText.innerText = `${(100 - passPercent).toFixed(1)}% (신뢰도: ${confPercent}%)`;
  }

  // 결정 경로 출력
  rulePath.innerHTML = `<strong>🔍 의사결정 트리의 판단 경로:</strong><br>` + path.join("  ➔  ");
  resContainer.scrollIntoView({ behavior: 'smooth' });
});
